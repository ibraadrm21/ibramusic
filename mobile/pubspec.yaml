name: ibramusic
description: "IbraMusic - Premium music player"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  lucide_icons_flutter: ^3.1.15
  cached_network_image: ^3.4.1
  flutter_blurhash: ^0.8.2
  palette_generator: ^0.3.3+4

  # Audio
  just_audio: ^0.9.46
  audio_service: ^0.18.17
  audio_session: ^0.1.21

  # Networking
  http: ^1.3.0
  dio: ^5.7.0

  # Data persistence
  shared_preferences: ^2.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5

  # Auth & Cloud Sync
  supabase_flutter: ^2.8.0

  # State management
  flutter_riverpod: ^2.6.1

  # Utils
  youtube_explode_dart: ^2.5.2
  rxdart: ^0.28.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
