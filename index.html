<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <meta name="description" content="Busca música, organiza tus listas y escucha con amigos en IbraMusic." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="IbraMusic" />
    <meta property="og:description" content="Busca música, organiza tus listas y escucha con amigos en IbraMusic." />
    <title>IbraMusic</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (window.electronAPI && window.electronAPI.writeLog) {
          window.electronAPI.writeLog("CRITICAL_ERROR", message + " at " + source + ":" + lineno + ":" + colno + (error ? "\n" + error.stack : ""));
        }
        // Don't pop up browser modal for benign storage quota warnings
        if (String(message).includes("QuotaExceededError") || (error && error.name === "QuotaExceededError")) {
          console.warn("Storage quota exceeded caught by window.onerror:", message);
          return true;
        }
        const root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          const notice = document.createElement("p");
          notice.textContent = "No se pudo abrir IbraMusic. ";
          notice.setAttribute("role", "alert");
          const reload = document.createElement("button");
          reload.textContent = "Reintentar";
          reload.onclick = () => window.location.reload();
          notice.append(reload);
          root.append(notice);
        }
        return false;
      };

      // Redirect Console to Electron Logger
      if (window.electronAPI && window.electronAPI.writeLog) {
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;

        console.log = function(...args) {
          originalLog.apply(console, args);
          window.electronAPI.writeLog("INFO", args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(" "));
        };
        console.warn = function(...args) {
          originalWarn.apply(console, args);
          window.electronAPI.writeLog("WARN", args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(" "));
        };
        console.error = function(...args) {
          originalError.apply(console, args);
          window.electronAPI.writeLog("ERROR", args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(" "));
        };
      }

    </script>
  </head>
  <body style="background: #0f0f0f; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
