<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="ibrastream - A beautiful and premium music player web application using MusicAPI and React" />
    <title>ibraStream - Let The Music Take You Away</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        if (window.electronAPI && window.electronAPI.writeLog) {
          window.electronAPI.writeLog("CRITICAL_ERROR", message + " at " + source + ":" + lineno + ":" + colno + (error ? "\n" + error.stack : ""));
        }
        // Don't pop up browser modal for benign storage quota warnings
        if (String(message).includes("QuotaExceededError") || (error && error.name === "QuotaExceededError")) {
          console.warn("Storage quota exceeded caught by window.onerror:", message);
          return true;
        }
        alert("Startup error: " + message + "\nSource: " + source + "\nLine: " + lineno + ":" + colno + "\nStack: " + (error ? error.stack : "N/A"));
        return false;
      };

      // Redirect Console to Electron Logger
      if (window.electronAPI && window.electronAPI.writeLog) {
        const originalLog = console.log;
        const originalWarn = console.warn;
        const originalError = console.error;

        console.log = function(...args) {
          originalLog.apply(console, args);
          window.electronAPI.writeLog("INFO", args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(" "));
        };
        console.warn = function(...args) {
          originalWarn.apply(console, args);
          window.electronAPI.writeLog("WARN", args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(" "));
        };
        console.error = function(...args) {
          originalError.apply(console, args);
          window.electronAPI.writeLog("ERROR", args.map(a => typeof a === 'object' ? JSON.stringify(a) : String(a)).join(" "));
        };
      }

      // Prevent Chromium and YouTube player from pausing when page visibility changes
      Object.defineProperty(document, 'visibilityState', {
        get: function() { return 'visible'; },
        configurable: true
      });
      Object.defineProperty(document, 'hidden', {
        get: function() { return false; },
        configurable: true
      });
      document.addEventListener('visibilitychange', function(e) {
        e.stopImmediatePropagation();
      }, true);
      window.addEventListener('visibilitychange', function(e) {
        e.stopImmediatePropagation();
      }, true);
    </script>
  </head>
  <body style="background: #0f0f0f; margin: 0; padding: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
